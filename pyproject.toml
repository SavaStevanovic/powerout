[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerout"
version = "0.1.0"
description = "Javlja na Telegram i/ili e-mail kada nestane struja na tvojoj lokaciji"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
powerout = "powerout.cli:main"

[tool.setuptools]
packages = ["powerout"]
